# === PUERTO DE BACKEND ===
spring.application.name=MarianaPlasticos-API
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mariana_plasticos?serverTimezone=America/Mexico_City&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:admin590}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === Dialecto y configuración JPA ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# === Conexión BD ===
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# === CORS ===
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# === Codificación ===
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# === Logs ===
logging.level.org.springframework.web=INFO
logging.level.com.example.demo=DEBUG

# === Clave de IA ===
gemini.api.key=${GEMINI_API_KEY:}