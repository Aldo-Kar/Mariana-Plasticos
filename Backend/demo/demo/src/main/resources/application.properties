# Nombre de la aplicacion
spring.application.name=MarianaPlasticos

# Puerto exclusivo para tu aplicacion de Java 
server.port=8080

# CONFIGURACION PARA MYSQL (Aqui ya se incluye tu puerto 3306)
spring.datasource.url=jdbc:mysql://localhost:3306/mariana_plasticos?serverTimezone=UTC&useSSL=false
spring.datasource.username=root
spring.datasource.password=admin590
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect