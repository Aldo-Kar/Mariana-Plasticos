spring.application.name=MarianaPlasticos-API
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mariana_plasticos?serverTimezone=America/Mexico_City&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:admin590}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.springframework.web=INFO
logging.level.com.example.demo=DEBUG
